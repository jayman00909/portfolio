<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credit Card Checkout</title>
    <link rel="stylesheet" href="credit-card.css" />
</head>

<body>

    <div class="checkout-container">
        <h2>Credit Card Checkout</h2>
        <p style="text-align:center;font-size:0.85rem;color:#555;margin:0 0 15px;">Demo only. Nothing is sent or stored. Please do not enter real card details.</p>
        <form id="cardForm">
            <label for="cardholder">Cardholder Name</label>
            <input type="text" id="cardholder" required />

            <label for="cardnumber">Card Number</label>
            <input type="text" id="cardnumber" maxlength="19" placeholder="1234 5678 9012 3456" required />

            <div class="row">
                <div>
                    <label for="expdate">Expiry Date</label>
                    <input type="text" id="expdate" maxlength="5" placeholder="MM/YY" required />
                </div>
                <div>
                    <label for="cvv">CVV</label>
                    <input type="text" id="cvv" maxlength="4" required />
                </div>
            </div>

            <button type="submit">Pay Now</button>
            <p id="formMessage"></p>
        </form>
    </div>

    <script src="credit-card.js"></script>
</body>

</html>
