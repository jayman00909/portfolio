<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Loan Calculator</title>
    <link rel="stylesheet" href="calculator.css" />
</head>

<body>
    <div class="theme-toggle">
        <button id="toggle-theme">🌞</button>
    </div>

    <div class="calculator">
        <h2>Auto Loan Calculator</h2>
        <form id="loan-form">
            <label>Vehicle Price ($)
                <input type="number" id="price" required />
            </label>
            <label>Down Payment ($)
                <input type="number" id="down" required />
            </label>
            <label>Interest Rate (%)
                <input type="number" step="0.01" id="interest" required />
            </label>
            <label>Loan Term (months)
                <input type="number" id="term" required />
            </label>
            <button type="submit">Calculate</button>
        </form>
        <div id="results" class="results hidden">
            <p>Monthly Payment: $<span id="monthly"></span></p>
            <p>Total Interest: $<span id="interest-paid"></span></p>
            <p>Total Amount Paid: $<span id="total"></span></p>
        </div>
    </div>

    <script src="calculator.js"></script>
</body>

</html>
